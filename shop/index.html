function initPlatformFilter(){const keys=SHOP_DATA.social.map(function(p){return p.id;}),filterViewport=document.getElementById("platform-filter-viewport"),filterTrack=document.getElementById("platform-filter-track"),filterButtons=[].slice.call(filterTrack.querySelectorAll("[data-platform-filter]")),indicator=filterTrack.querySelector(".platform-filter-indicator"),gallery=document.getElementById("platform-gallery"),panels=[].slice.call(gallery.querySelectorAll("[data-platform-panel]"));let activeProgress=0,scrollSource="gallery",filterSnapTimer=0,gallerySnapTimer=0;function clamp(v,min,max){return Math.max(min,Math.min(max,v));}function filterStops(){const max=filterViewport.scrollWidth-filterViewport.clientWidth;return filterButtons.map(function(b){return clamp(b.offsetLeft+b.offsetWidth/2-filterViewport.clientWidth/2,0,max);});}function progressFromFilter(){const stops=filterStops(),x=filterViewport.scrollLeft;if(stops.length<2||stops[stops.length-1]<=stops[0])return 0;for(let i=0;i<stops.length-1;i++){if(x<=stops[i+1]){const span=stops[i+1]-stops[i];return i+(span?clamp((x-stops[i])/span,0,1):0);}}return stops.length-1;}function setFilterEdgePadding(){if(!filterButtons.length)return;const last=filterButtons[filterButtons.length-1].getBoundingClientRect().width;const sideEnd=Math.max(0,(filterViewport.clientWidth-last)/2);filterTrack.style.paddingInlineStart="0px";filterTrack.style.paddingInlineEnd=sideEnd+"px";}function renderProgress(value){activeProgress=clamp(value,0,keys.length-1);const low=Math.floor(activeProgress),high=Math.min(keys.length-1,low+1),fraction=activeProgress-low,left=filterButtons[low].offsetLeft+(filterButtons[high].offsetLeft-filterButtons[low].offsetLeft)*fraction,width=filterButtons[low].offsetWidth+(filterButtons[high].offsetWidth-filterButtons[low].offsetWidth)*fraction;indicator.style.transform="translateX("+left+"px)";indicator.style.width=width+"px";const active=Math.round(activeProgress);filterButtons.forEach(function(b,i){const sel
